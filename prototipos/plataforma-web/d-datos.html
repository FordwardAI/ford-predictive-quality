<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Datos y prueba final · FordwardAI</title>
<link rel="stylesheet" href="ui.css">
</head>
<body data-role="desk" data-active="datos" data-title="Datos y prueba final" data-sub="Fuentes verificadas, preparación, particiones y estado de la prueba final">
<div id="act"></div>
<div id="page"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
window.render = U => {
  const { B, I, num, dec, pct, pend } = U;
  const D = B.datos, M = B.meta, R = B.preregistro;
  const tr = D.particiones.map(p => `<tr class="${p.cal == null ? '' : ''}"><td class="wrap"><b>${p.nombre}</b></td><td class="wrap">${p.dias}</td><td class="num">${num(p.vins)}</td>
    <td class="num">${p.cal == null ? `<span class="tag pend">${I('lock')}enmascarada</span>` : num(p.cal)}</td><td class="num">${p.cal == null ? '—' : pct(p.cal / p.vins)}</td></tr>`).join('');
  const cupo = [['Validación', D.cupo_diario.validacion], ['Prueba final (sin etiquetas)', D.cupo_diario.prueba_final_sin_etiquetas], ['Después del Día 260 (sin etiquetas)', D.cupo_diario.despues_260_sin_etiquetas]];
  const F = D.fuga;
  document.getElementById('act').innerHTML = `<button class="btn">${I('file')}Ver preregistro</button>`;
  document.getElementById('page').innerHTML = `
  <div class="grid" style="align-items:start;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)">
    <div class="grid" style="gap:16px;align-content:start">
      <div class="card">
        <div class="hd"><h2>Fuentes</h2><span class="tag ok">${I('check')}huellas verificadas</span></div>
        <table class="t"><thead><tr><th>Archivo</th><th>Huella SHA-256 (abreviada)</th><th>Contenido</th><th>Estado</th></tr></thead><tbody>
          <tr><td><b>${M.fuente.csv}</b></td><td>${M.fuente.csv_sha}…</td><td class="wrap">${num(D.eventos)} eventos de calidad</td><td><span class="tag ok">${I('check')}vigente</span></td></tr>
          <tr><td><b>${M.fuente.catalogo}</b></td><td>${M.fuente.catalogo_sha}…</td><td>agrupación del catálogo</td><td><span class="tag ok">${I('check')}vigente</span></td></tr>
        </tbody></table>
        <div class="bd grid g4" style="gap:12px">
          <div><div class="eyebrow">Duplicados exactos</div><div class="big">${num(D.duplicados)}</div><div class="xs muted">conservados: la causa no se conoce</div></div>
          <div><div class="eyebrow">#N/A en Fecha Reparación</div><div class="big">${num(D.na_reparacion)}</div><div class="xs muted">no cuentan para el Día del VIN</div></div>
          <div><div class="eyebrow">Descripciones desalineadas</div><div class="big">${D.desalineadas.length}</div><div class="xs muted">columnas ${D.desalineadas[0][0]}–${D.desalineadas[D.desalineadas.length - 1][0]}: se usan los nombres técnicos</div></div>
          <div><div class="eyebrow">Población principal</div><div class="big">${num(M.poblacion)}</div><div class="xs muted">VIN auditados con actividad QLS</div></div>
        </div>
      </div>
      <div class="card">
        <div class="hd"><h2>Particiones por Día del VIN</h2><span class="tag ${D.todo_coincide ? 'ok' : 'bad'}">${I(D.todo_coincide ? 'check' : 'x')}coinciden con las publicadas</span></div>
        <table class="t"><thead><tr><th>Tramo</th><th>Día del VIN</th><th class="num">VIN</th><th class="num">CALIBRADA</th><th class="num">Proporción CALIBRADA</th></tr></thead><tbody>${tr}</tbody></table>
        <div class="ft">Entre auditados con actividad QLS, base ficticia. Unidad: VIN. Las etiquetas de Día ≥ 200 quedan enmascaradas al cargar: solo se cuentan VIN. El Día del VIN es la última fecha de evento y aproxima el día de la auditoría.</div>
      </div>
      <div class="grid g2">
        <div class="card">
          <div class="hd"><h2>El componente es fuga</h2></div>
          <div class="bd">
            <table class="t"><thead><tr><th>Hasta el Día 194</th><th class="num">Con componente</th><th class="num">Sin componente</th></tr></thead><tbody>
              <tr><td><b>CALIBRADA</b></td><td class="num">${num(F.calibrada_con_componente)}</td><td class="num">${num(F.calibrada_sin_componente)}</td></tr>
              <tr><td><b>OK</b></td><td class="num">${num(F.ok_con_componente)}</td><td class="num">${num(F.ok_sin_componente)}</td></tr></tbody></table>
            <p class="small ink2" style="margin-bottom:0">${F.lectura} Por eso es lo que se predice («dónde mirar»), nunca un predictor.</p>
          </div>
        </div>
        <div class="card">
          <div class="hd"><h2>Códigos nuevos</h2></div>
          <div class="bd small">
            <dl class="kv"><dt>Validación</dt><dd><b>${D.codigos_nuevos.validacion.codigos_sin_historial_en_149}</b> códigos sin historial hasta el Día 149 (${num(D.codigos_nuevos.validacion.vins_de_esos_codigos)} VIN)</dd>
            <dt>Prueba final</dt><dd><b>${D.codigos_nuevos.prueba_final.codigos_sin_historial_en_149}</b> códigos (${num(D.codigos_nuevos.prueba_final.vins_de_esos_codigos)} VIN)</dd>
            <dt>Mercados nuevos</dt><dd>${D.codigos_nuevos.validacion.mercados_sin_historial_en_149 + D.codigos_nuevos.prueba_final.mercados_sin_historial_en_149}: todo código nuevo tiene un mercado conocido</dd></dl>
            <p class="ink2" style="margin-bottom:0">Un código sin resultados usa la tasa general en la hoja y recibe unidades por el mínimo por código.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="grid" style="gap:16px;align-content:start">
      <div class="card accent">
        <div class="hd">${I('flask')}<h2>Prueba final</h2><div class="sp"></div>${pend()}</div>
        <div class="bd">
          <p class="small ink2" style="margin-top:0">Tramo desde el Día 200, que se lee <b>una sola vez</b> con la alternativa elegida y congelada. Ninguna cifra de prueba aparece en esta plataforma hasta la sesión conjunta.</p>
          <div class="eyebrow">Preregistro</div>
          <div style="display:flex;align-items:center;gap:10px;margin:4px 0 10px"><span class="tag warn">${I('clock')}${R.estado}</span><span class="xs muted">versión del ${R.fecha.split('-').reverse().join('/')}</span></div>
          <dl class="kv small"><dt>Alternativa</dt><dd><b>${R.ganadora}</b></dd><dt>En la prueba</dt><dd>${R.en_prueba}</dd><dt>Mínimo por código</dt><dd>P = ${R.P}</dd><dt>Detector</dt><dd>h = ${dec(R.h, 1)}</dd>
            <dt>Semillas</dt><dd>desempate ${R.semillas.desempate} · bootstrap ${R.semillas.bootstrap} · ${num(R.semillas.remuestreos)} remuestreos</dd><dt>Hoja final (E3)</dt><dd>${R.e3}</dd></dl>
          <hr class="sep">
          <table class="t"><thead><tr><th>Tramo de la prueba</th><th class="num">VIN</th><th>Lectura</th><th>Resultado</th></tr></thead><tbody>
          ${R.tramos.map(t => `<tr><td class="wrap">${t.nombre}</td><td class="num">${num(t.vin)}</td><td class="wrap xs">${t.lectura}</td><td>${pend('pendiente')}</td></tr>`).join('')}
          </tbody></table>
        </div>
        <div class="ft">${R.como_acordar}</div>
      </div>
      <div class="card">
        <div class="hd"><h2>Cupo diario por tramo</h2><span class="xs muted">5 % de los VIN del día, hacia abajo, mínimo 1</span></div>
        <table class="t"><thead><tr><th>Tramo</th><th class="num">Días con VIN</th><th class="num">Cupo total</th><th class="num">VIN por día (mediana)</th></tr></thead><tbody>
        ${cupo.map(([n, c]) => `<tr><td>${n}</td><td class="num">${c.dias_con_vin}</td><td class="num">${num(c.suma_k_d)}</td><td class="num">${num(c.vin_por_dia_mediana)}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>
  </div>`;
};
</script>
</body>
</html>
