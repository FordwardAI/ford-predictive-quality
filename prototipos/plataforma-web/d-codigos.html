<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Códigos programados · FordwardAI</title>
<link rel="stylesheet" href="ui.css">
</head>
<body data-role="desk" data-active="codigos" data-title="Códigos programados" data-sub="Todos los códigos del programa del día, con su tasa, su rango y su mercado de destino">
<div id="act"></div>
<div id="page"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
window.render = U => {
  const { B, QS, I, num, dec, pct, rng, esc, tramoV } = U;
  const h = B.hoja, sel = QS.get('mercado') === 'primero' ? h.por_que[0].mercado : QS.get('mercado');  // ?mercado=primero: el del primer código del ranking.
  const mercados = [...new Set(h.filas.map(f => f.mercado))].sort();
  const filas = h.filas.filter(f => !sel || f.mercado === sel);
  const alertas = U.alertasConocidas();
  const maxR = 0.5;
  const mini = f => {
    const W = 150, x = v => 4 + (W - 8) * Math.min(v, maxR) / maxR;
    if (!f.rango) return '<span class="xs muted">sin resultados</span>';
    return `<svg class="chart" viewBox="0 0 ${W} 14" style="width:${W}px"><line x1="${x(h.general)}" x2="${x(h.general)}" y1="0" y2="14" stroke="var(--ink-2)" stroke-dasharray="2 2"/><line x1="${x(f.rango[0])}" x2="${x(f.rango[1])}" y1="7" y2="7" stroke="${f.sugerida ? 'var(--accent)' : 'var(--ref)'}" stroke-width="3" stroke-linecap="round"/><circle cx="${x(f.tasa)}" cy="7" r="4" fill="${f.sugerida ? 'var(--accent)' : 'var(--ford-blue)'}" stroke="#fff" stroke-width="1.5"/></svg>`;
  };
  const ag = Object.entries(h.agrupaciones).sort((a, b) => b[1].chi2 - a[1].chi2);
  const mv = B.mercados.filter(m => m.n > 0);
  const nM = mv.reduce((s, m) => s + m.n, 0), cM = mv.reduce((s, m) => s + m.cal, 0);
  document.getElementById('act').innerHTML = `<button class="btn">${I('download')}Exportar tabla</button>`;
  document.getElementById('page').innerHTML = `
  <div style="display:flex;align-items:center;gap:10px"><span class="small ink2 nowrap">${I("filter")} Mercado de destino</span>
    <div class="seg"><a href="d-codigos.html" class="${sel ? '' : 'on'}">Todos (${h.filas.length})</a>${mercados.map(m => `<a href="?mercado=${m}" class="${sel === m ? 'on' : ''}">${m} (${h.filas.filter(f => f.mercado === m).length})</a>`).join('')}</div>
    </div>
  <div class="grid" style="align-items:start;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)">
    <div class="card">
      <div class="hd"><h2>${sel ? `Códigos con destino ${sel}` : 'Todos los códigos programados'}</h2><span class="tag gray">${filas.length}</span><div class="sp"></div><span class="legend"><span><i></i>con cantidad sugerida</span><span><i class="dash"></i>tasa general ${pct(h.general)}</span></span></div>
      <table class="t">
        <thead><tr><th class="num">#</th><th>Código</th><th class="num">Tasa</th><th>Rango 95 % <span style="font-weight:400">(0 a 50 %)</span></th><th class="num">n</th><th class="num">Veces la<br>tasa general</th><th class="num">Programadas</th><th>Mercado de destino</th><th>Detector</th></tr></thead>
        <tbody>${filas.map(f => {
          const a = alertas.find(x => x.codigo === f.codigo);
          return `<tr class="${f.sugerida ? 'hl' : ''}" data-tip="${esc(`${f.codigo}: ${pct(f.tasa)} (${rng(f.rango)}), ${f.cal} de ${f.n}`)}"><td class="num muted">${h.filas.indexOf(f) + 1}</td><td class="cod"><a href="d-codigo.html?c=${f.codigo}">${f.codigo}</a></td><td class="num">${pct(f.tasa)}</td><td>${mini(f)}</td><td class="num">${num(f.n)}</td><td class="num">${dec(f.veces)}</td><td class="num">${f.programadas}</td><td>${f.mercado}</td>
            <td>${a ? `<span class="tag warn">${I(a.sentido === 'sube' ? 'up' : 'dn')}${a.sentido === 'sube' ? 'subió' : 'bajó'}</span>` : '<span class="xs muted">sin alerta</span>'}</td></tr>`;
        }).join('')}</tbody>
      </table>
      <div class="ft">Entre auditados con actividad QLS, hasta el Día ${h.ventana[1]}, base ficticia, n = ${num(h.n_ventana)} VIN. Rango de Wilson del 95 % con los resultados propios del código.</div>
    </div>
    <div class="grid" style="gap:16px;align-content:start">
      <div class="card">
        <div class="hd"><h2>Señal por mercado de destino</h2></div>
        <div class="bd">
          <div class="eyebrow">Diferencia entre grupos (χ²), ${tramoV}</div>
          ${U.hbars({ w: 370, max: ag[0][1].chi2 * 1.05, m: { l: 160, r: 44 }, rows: ag.map(([k, v], i) => ({ label: `${k} (${v.grupos})`, v: v.chi2, text: dec(v.chi2, 1), bold: i === 0, color: i === 0 ? 'var(--accent)' : 'var(--ref)', tip: `${k}: χ² ${dec(v.chi2, 1)} con ${v.grupos} grupos` })) })}
          <p class="small ink2" style="margin:8px 0 0">En validación, el mercado de destino separa las tasas mucho más que el motor, la tracción o la versión (entre paréntesis, la cantidad de grupos). Es una asociación, no una causa.</p>
          <div class="q-line" style="margin-top:6px">${U.Qs()}.</div>
        </div>
      </div>
      <div class="card">
        <div class="hd"><h2>Tasa por mercado de destino</h2></div>
        <div class="bd">
          ${U.hbars({ w: 370, max: 0.4, m: { l: 90, r: 110 }, ref: cM / nM, rows: mv.map(m => ({ label: m.mercado, v: m.tasa, lo: m.rango[0], hi: m.rango[1], text: `${pct(m.tasa)} · n ${num(m.n)}`, bold: m.mercado === sel, color: m.mercado === (sel || h.por_que[0].mercado) ? 'var(--accent)' : 'var(--ref)', tip: `${m.mercado}: ${m.cal} CALIBRADA de ${num(m.n)} (${U.rng(m.rango)}); ${m.codigos} códigos con resultados, ${m.programados_hoy} programados hoy` })) })}
          <div class="xs muted" style="margin-top:6px">Línea punteada: tasa del conjunto, ${pct(cM / nM)}. Entre auditados con actividad QLS, días ${B.ventana_mercados[0]}–${B.ventana_mercados[1]} (resultados conocidos el Día ${h.dia}), base ficticia, n = ${num(nM)} VIN.</div>
        </div>
      </div>
    </div>
  </div>`;
};
</script>
</body>
</html>
