<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Días de control · FordwardAI</title>
<link rel="stylesheet" href="ui.css">
</head>
<body data-role="desk" data-active="control" data-title="Seguimiento de días de control" data-sub="Implementación inicial: se alternan días con hoja y días al azar para medir la hoja en las mismas condiciones">
<div id="act"></div>
<div id="page"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
window.render = U => {
  const { B, I, num, dec, pct, rngx, tramoV } = U;
  const C = B.control, X = B.exploracion.control, V = B.meta.tramo_validacion;
  const por = Object.fromEntries(C.diario.map(d => [d.dia, d]));
  const ac = C.acumulado.filter(a => a.veces != null);
  const H = C.diario.filter(d => !d.control), K = C.diario.filter(d => d.control);
  const sum = (a, k) => a.reduce((s, x) => s + x[k], 0);
  const dias = []; for (let d = V[0]; d <= V[1]; d++) dias.push(d);
  const cal = `<div class="cal">${dias.map(d => {
    const x = por[d];
    if (!x) return `<div class="d x"><b>${d}</b>sin<br>VIN</div>`;
    return `<div class="d ${x.control ? 'c' : 'h'}" data-tip="Día ${d}: ${x.control ? 'control (al azar)' : 'con hoja'} · ${x.cal} CALIBRADA de ${x.k} elegidos entre ${num(x.n)} VIN"><b>${d}</b>${x.control ? 'control' : 'hoja'}<br>${x.cal}/${x.k}</div>`;
  }).join('')}</div>`;
  const yMax = Math.max(...ac.map(a => a.rango[1])) * 1.05;
  const chart = U.lineChart({
    w: 590, h: 270, x0: V[0], x1: V[1], y0: 0, y1: Math.min(yMax, 6), yt: [0, 1, 2, 3, 4, 5].filter(v => v <= Math.min(yMax, 6)), yf: v => dec(v, 0),
    xt: [V[0], V[0] + 10, V[0] + 20, V[0] + 30, V[1]], xf: v => 'Día ' + v, m: { l: 30, r: 120, t: 12, b: 28 },
    series: [{ pts: ac.map(a => ({ x: a.dia, y: a.veces, lo: a.rango[0], hi: Math.min(a.rango[1], 6), tip: `Hasta el Día ${a.dia}: ${a.dias_hoja} días con hoja y ${a.dias_control} de control · ${dec(a.veces)} (${rngx(a.rango)})` })), color: 'var(--accent)', band: 'var(--accent-soft-2)', tipPts: true, label: `estimado ${dec(ac[ac.length - 1].veces)}` }],
    hlines: [{ y: 1, label: '', color: 'var(--ink-2)' }, { y: X.veces_azar_real_etiquetas_completas, label: `etiquetas completas ${dec(X.veces_azar_real_etiquetas_completas)}`, dash: '4 3', color: 'var(--ford-blue)', left: true }],
  });
  document.getElementById('act').innerHTML = `<a class="btn" href="d-config.html">${I('cal')}Calendario</a><button class="btn">${I('download')}Exportar seguimiento</button>`;
  document.getElementById('page').innerHTML = `
  <div class="note warn">${I('alert')}<div><b>Simulación sobre la base, ${tramoV}.</b> En planta esta pantalla se llenaría con los resultados reales de cada día. La duración y el tamaño de la etapa no se fijan: sin datos reales no se puede calcular la potencia.</div></div>
  <div class="grid g4">
    <div class="card kpi"><div class="lb">${I('calcheck')}Días registrados</div><div class="v">${C.diario.length}</div><div class="d">${H.length} con hoja · ${K.length} de control (al azar)</div></div>
    <div class="card kpi"><div class="lb">Precisión, días con hoja</div><div class="v">${pct(X.precision_dias_hoja)}</div><div class="d">${sum(H, 'cal')} CALIBRADA de ${sum(H, 'k')} elegidos</div></div>
    <div class="card kpi"><div class="lb">Precisión, días de control</div><div class="v" style="color:var(--ford-blue)">${pct(X.precision_dias_control)}</div><div class="d">${sum(K, 'cal')} CALIBRADA de ${sum(K, 'k')} elegidos al azar</div></div>
    <div class="card kpi"><div class="lb">Veces el azar estimado</div><div class="v">${dec(X.veces_azar_estimado_con_control)}</div><div class="d">rango 95 %: ${rngx(X.veces_azar_estimado_rango95)} · con etiquetas completas ${dec(X.veces_azar_real_etiquetas_completas)} (${rngx(X.veces_azar_real_rango95)})</div></div>
  </div>
  <div class="grid" style="align-items:start;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)">
    <div class="card">
      <div class="hd"><h2>Veces el azar, acumulado</h2><div class="sp"></div><span class="legend"><span><i></i>estimado</span><span><i class="band"></i>rango 95 %</span><span><i style="background:var(--ford-blue)"></i>con etiquetas completas</span></span></div>
      <div class="bd">${chart}<div class="xs muted">Cada punto compara la precisión de los días con hoja con la de los días de control acumulados hasta ese día. El rango (bootstrap por días) se angosta a medida que se suman días. La línea continua en 1 es la selección al azar.</div></div>
      <div class="ft">${U.Qs()}. Predictor: ${B.evaluacion.ganadora}; exploración: ${B.exploracion.elegida}. Las etiquetas de ambos tipos de día alimentan la hoja.</div>
    </div>
    <div class="card">
      <div class="hd"><h2>Calendario de la etapa</h2><span class="legend"><span><i style="height:10px;background:var(--ford-skyview)"></i>con hoja</span><span><i style="height:10px;background:var(--ford-blue)"></i>control</span></span></div>
      <div class="bd">${cal}<div class="xs muted" style="margin-top:8px">Días del VIN de la validación, alternados en orden: uno con hoja, uno al azar. En cada celda: CALIBRADA / elegidos del día.</div></div>
      <div class="ft">Terminada la etapa, la hoja orienta todo el cupo y los días de control se dejan de usar.</div>
    </div>
  </div>`;
};
</script>
</body>
</html>
