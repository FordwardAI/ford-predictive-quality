<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Exploración · FordwardAI</title>
<link rel="stylesheet" href="ui.css">
</head>
<body data-role="desk" data-active="exploracion" data-title="Exploración con etiquetas parciales" data-sub="Cómo sigue aprendiendo la hoja cuando solo se conoce el resultado de lo que se audita">
<div id="act"></div>
<div id="page"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
window.render = U => {
  const { B, I, num, dec, pct, rng, rngx, tramoV, lect } = U;
  const X = B.exploracion, C = X.control, V = B.meta.tramo_validacion;
  const cap = s => /^[a-zñáéíóú]/.test(s) ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const pol = n => X.politicas.find(p => p.alternativa === n);
  const eleg = pol(X.elegida), eps = X.politicas.find(p => p.tipo === 'epsilon'), az = X.politicas.find(p => p.tipo === 'azar'), vor = X.politicas.find(p => p.tipo === 'voraz');
  const serie = (p, color, label, extra = {}) => ({ pts: p.acumulada.map((y, i) => ({ x: X.dias[i], y })), color, label, ...extra });
  const chart = U.lineChart({
    w: 470, h: 230, x0: X.dias[0], x1: X.dias[X.dias.length - 1], y1: 0.3, yt: [0, 0.1, 0.2, 0.3], yf: v => dec(100 * v, 0) + ' %',
    xt: [V[0], V[0] + 20, V[1]], xf: v => 'Día ' + v, m: { l: 36, r: 100, t: 12, b: 28 },
    series: [serie(az, 'var(--line-grey)', 'azar'), serie(eps, 'var(--ford-blue)', 'ε = 20 %', { dash: '5 3' }), serie(eleg, 'var(--accent)', `mínimo, P = ${X.P}`, { sw: 2.5 })],
  });
  const ctl = U.dotRows({
    w: 560, x0: 0, x1: 3, xt: [0, 0.5, 1, 1.5, 2, 2.5, 3], xf: v => dec(v, 1), rowH: 30, m: { l: 250, r: 70, t: 28, b: 28 },
    vlines: [{ x: 1, label: 'igual que el azar' }],
    rows: [{ label: 'Estimado con días de control', v: C.veces_azar_estimado_con_control, lo: C.veces_azar_estimado_rango95[0], hi: C.veces_azar_estimado_rango95[1], color: 'var(--accent)', bold: true, note: dec(C.veces_azar_estimado_con_control), tip: `Días con hoja (${C.dias_hoja}) frente a días al azar (${C.dias_control}): ${rngx(C.veces_azar_estimado_rango95)}` },
      { label: 'Con etiquetas completas', v: C.veces_azar_real_etiquetas_completas, lo: C.veces_azar_real_rango95[0], hi: C.veces_azar_real_rango95[1], color: 'var(--ford-blue)', note: dec(C.veces_azar_real_etiquetas_completas), tip: rngx(C.veces_azar_real_rango95) }],
  });
  document.getElementById('act').innerHTML = `<a class="btn" href="d-control.html">${I('calcheck')}Seguimiento de días de control</a>`;
  document.getElementById('page').innerHTML = `
  <div class="note info">${I('info')}<div><b>Supuesto de la simulación:</b> ${X.supuesto}. Es lo que pasaría en planta: la hoja arranca con el histórico de auditorías al azar y después solo se conoce el resultado de lo que elige.</div></div>
  <div class="grid" style="align-items:start;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">
    <div class="card">
      <div class="hd"><h2>Políticas con etiquetas parciales</h2><span class="xs muted">predictor: ${B.evaluacion.ganadora}</span></div>
      <table class="t"><thead><tr><th>Política</th><th class="num">CALIBRADA /<br>elegidos</th><th class="num">Precisión en el cupo<br>(rango 95 %)</th><th class="num">Veces<br>el azar</th><th>Empata con<br>la mejor</th></tr></thead>
      <tbody>${X.politicas.map(p => `<tr class="${p.alternativa === X.elegida ? 'hl' : !p.elegible ? 'dim' : ''}"><td><b>${cap(p.alternativa.replace(' (referencia de costo)', ''))}</b> ${p.elegible ? '' : '<span class="muted">· referencia</span>'}</td><td class="num">${p.cal} / ${num(p.elegidos)}</td><td class="num">${pct(p.precision)} <span class="muted">(${rng(p.rango)})</span></td><td class="num">${dec(p.veces)}</td><td>${p.alternativa === X.elegida ? '<span class="tag ok">' + I('check') + 'elegida</span>' : p.empata === true ? 'sí' : p.empata === false ? 'no' : '—'}</td></tr>`).join('')}</tbody></table>
      <div class="ft">${U.Qs()}, ${num(eleg.elegidos)} elegidos en ${X.dias.length} días. Regla: mayor precisión en el cupo; entre empatadas, la rotación con el período más largo (P entre ${X.periodos.join(', ')}).</div>
    </div>
    <div class="grid" style="gap:16px;align-content:start">
      <div class="card">
        <div class="hd"><h2>Precisión acumulada día a día</h2></div>
        <div class="bd">${chart}<div class="xs muted">Reservar un 20 % permanente al azar baja la precisión a ${pct(eps.precision)}; el mínimo por código conserva la del ranking puro (${pct(eleg.precision)} contra ${pct(vor.precision)}).</div></div>
      </div>
      <div class="card">
        <div class="hd"><h2>Mínimo por código elegido</h2><span class="tag ok">P = ${X.P}</span></div>
        <div class="bd small ink2">Cada código que se produce recibe, por rotación, una auditoría si no tuvo resultado en los últimos ${X.P} días, aunque no esté priorizado. En la hoja aparece en filas aparte. Mantiene la tasa de los códigos poco elegidos sin reservar cupo al azar.</div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="hd"><h2>Días de control: estimado frente a real</h2><span class="tag prop">simulación sobre la base, ${tramoV}</span></div>
    <div class="bd grid" style="align-items:start;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center">
      <div>${ctl}</div>
      <div class="small ink2">
        <p style="margin-top:0">Se alternan <b>${C.dias_hoja} días con hoja</b> y <b>${C.dias_control} días al azar</b>. Los días al azar dan la referencia en las mismas condiciones de producción, sin usar etiquetas de lo no elegido.</p>
        <p>Estimación: <b>${dec(C.veces_azar_estimado_con_control)} veces el azar</b> (${rngx(C.veces_azar_estimado_rango95)}), contra ${dec(C.veces_azar_real_etiquetas_completas)} (${rngx(C.veces_azar_real_rango95)}) con las etiquetas completas, que en planta no se tendrían. El rango es más ancho porque usa la mitad de los días: la duración de la etapa en planta se calcula con datos reales.</p>
        <div class="q-line">${U.Qs()}.</div>
      </div>
    </div>
  </div>`;
};
</script>
</body>
</html>
