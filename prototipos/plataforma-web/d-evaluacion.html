<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Evaluación · FordwardAI</title>
<link rel="stylesheet" href="ui.css">
</head>
<body data-role="desk" data-active="evaluacion" data-title="Evaluación de alternativas" data-sub="Todas las alternativas elegibles frente al azar con el mismo cupo diario, en validación">
<div id="act"></div>
<div id="page"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
window.render = U => {
  const { B, QS, I, num, dec, pct, rng, rngx, esc, tramoV, lect, pend } = U;
  const E = B.evaluacion, vista = QS.get('vista') || 'alternativas';
  const A = E.alternativas;
  const cap = s => /^[a-zñáéíóú]/.test(s) ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const nota = a => a.alternativa === E.ganadora ? `${pct(a.precision)} · elegida` : a.alternativa === E.mejor ? `${pct(a.precision)} · la mejor` : !a.elegible ? pct(a.precision) : a.empata ? 'empata' : 'por debajo';
  const corto = t => t.length > 40 ? t.slice(0, 39).trimEnd() + '…' : t;
  const fila = a => ({ label: corto(cap(a.alternativa)), v: a.precision, lo: a.rango[0], hi: a.rango[1], note: nota(a), bold: a.alternativa === E.ganadora,
    color: a.alternativa === E.ganadora ? 'var(--accent)' : a.elegible && !a.empata ? 'var(--text-grey)' : 'var(--line-grey)', diamond: !a.elegible,
    tip: `${cap(a.alternativa)}: ${pct(a.precision)} (${rng(a.rango)}), ${a.cal} CALIBRADA de ${num(a.elegidos)} elegidos · ${dec(a.veces)} veces el azar`, bg: a.alternativa === E.ganadora ? 'var(--accent-soft)' : '' });
  const grupos = [['Tasa fija', a => a.familia === 'tasa_fija'], ['Tasa móvil', a => a.familia === 'movil'], ['Suavizado hacia el mercado', a => a.familia === 'movil_mercado'],
    ['Decaimiento exponencial', a => a.familia === 'decaimiento'], ['Aprendizaje automático sobre el código', a => a.pieza === 'p4'],
    ['Referencias que no pueden elegirse', a => a.familia === 'oraculo' || a.familia === 'fuga']];
  const rows = grupos.flatMap(([g, fn]) => [{ head: true, label: g }, ...A.filter(fn).map(fila)]);
  const tabs = `<div class="tabs"><a href="d-evaluacion.html" class="${vista === 'alternativas' ? 'on' : ''}">Alternativas (${E.elegibles} elegibles)</a><a href="?vista=ml" class="${vista === 'ml' ? 'on' : ''}">Familias de aprendizaje automático</a></div>`;
  document.getElementById('act').innerHTML = `<button class="btn">${I('download')}Exportar comparación</button>`;
  const lateral = `<div class="grid" style="gap:16px;align-content:start">
      <div class="card accent"><div class="hd"><h2>Elegida en validación</h2>${lect(E.lectura)}</div><div class="bd">
        <div class="eyebrow">${E.ganadora}</div>
        <div style="display:flex;gap:18px;margin-top:6px"><div><div class="big">${pct(E.precision)}</div><div class="xs muted">precisión en el cupo · ${rng(E.rango)}</div></div><div><div class="big">${dec(E.veces)}</div><div class="xs muted">veces el azar · ${rngx(E.veces_rango)}</div></div></div>
        <p class="small ink2">Al azar con el mismo cupo diario: <b>${pct(E.azar_mismo_cupo)}</b> esperado (un sorteo simulado dio ${pct(E.azar_sorteo)}). ${E.cal_ganadora} CALIBRADA en ${num(E.elegidos)} elegidos durante ${E.dias} días.</p>
        <div class="q-line">${U.Qs()}.</div>
        <hr class="sep"><div style="display:flex;align-items:center;gap:8px"><span class="small"><b>Prueba final</b></span><span class="sp" style="flex:1"></span>${pend()}</div>
      </div></div>
      <div class="card"><div class="hd"><h2>Regla de elección</h2></div><div class="bd small ink2">
        <ol style="margin:0;padding-left:18px"><li>Mayor precisión en el cupo.</li><li>Empatan las que tienen un rango pareado por días de la diferencia con la mejor que incluye 0.</li><li>Entre las empatadas, gana la más simple.</li></ol>
        <hr class="sep"><div style="display:flex;gap:18px"><div><div class="big">${E.empatan}</div><div class="xs muted">de ${E.elegibles} empatan con la mejor</div></div><div><div class="big">${E.elegibles - E.empatan}</div><div class="xs muted">quedan por debajo</div></div></div>
        <p class="xs muted" style="margin-bottom:0">La mejor precisión fue ${E.mejor} (${pct(A.find(a => a.alternativa === E.mejor).precision)}): empata, y la regla elige la más simple. Rango del 95 % por bootstrap de días, ${num(E.semillas_bootstrap.remuestreos)} remuestreos, semilla ${E.semillas_bootstrap.bootstrap}.</p>
      </div></div>
      <div class="card"><div class="hd"><h2>Referencias</h2></div><div class="bd small ink2">
        <ul class="list"><li><span class="dot" style="background:var(--ink)"></span><div><b>Azar, mismo cupo</b>: lo que logra hoy la selección aleatoria, en promedio.</div></li>
        <li><span class="dot" style="background:#fff;border:2px solid var(--ink-2)"></span><div><b>Oráculo</b>: usa la tasa real del tramo. Es el techo, no se puede elegir.</div></li>
        <li><span class="dot" style="background:#fff;border:2px solid var(--ink-2)"></span><div><b>Con fuga</b>: usa resultados antes de que se conozcan. Se muestra para explicar por qué no se usa.</div></li></ul>
      </div></div>
    </div>`;

  if (vista === 'ml') {
    const ml = A.filter(a => a.pieza === 'p4');
    const fam = [...new Set(ml.map(a => a.familia))];
    const nombre = f => cap(ml.find(a => a.familia === f).alternativa.split(/ fijo| reentrenado/)[0]);
    const celda = a => a ? `<td class="num">${pct(a.precision)} <span class="muted">(${rng(a.rango)})</span></td><td class="num">${a.semillas ? `${dec(100 * a.semillas.min, 1)}–${pct(a.semillas.max)}` : '<span class="muted">determinista</span>'}</td><td>${a.empata ? '<span class="tag gray">empata</span>' : `<span class="tag gray">${I('dn')}por debajo</span>`}</td>` : '<td></td><td></td><td></td>';
    const pares = fam.flatMap(f => { const fi = ml.find(a => a.familia === f && a.modo === 'fijo'), re = ml.find(a => a.familia === f && a.modo === 'reentrenado'); const sub = a => Object.assign(fila(a), { label: corto(cap(a.alternativa.slice(a.alternativa.search(/ fijo| reentrenado/) + 1))) }); return [{ head: true, label: nombre(f) }, sub(fi), sub(re)]; });
    document.getElementById('page').innerHTML = `${tabs}
    <div class="card"><div class="hd"><h2>Fijo (entrenado con ≤ ${B.detector.p0_hasta}) frente a reentrenado periódicamente</h2><div class="sp"></div><span class="xs muted">cada familia con su mejor ajuste interno</span></div>
      <table class="t"><thead><tr><th>Familia</th><th class="num">Fijo: precisión (rango 95 %)</th><th class="num">Semillas</th><th>Lectura</th><th class="num">Reentrenado: precisión (rango 95 %)</th><th class="num">Semillas</th><th>Lectura</th></tr></thead>
      <tbody>${fam.map(f => `<tr><td><b>${nombre(f)}</b></td>${celda(ml.find(a => a.familia === f && a.modo === 'fijo'))}${celda(ml.find(a => a.familia === f && a.modo === 'reentrenado'))}</tr>`).join('')}</tbody></table>
      <div class="ft">«Semillas»: rango de la precisión en el cupo con ${ml.find(a => a.semillas).semillas.n} semillas del modelo; se informa la semilla mediana. ${U.Qs()}.</div></div>
    <div class="grid" style="align-items:start;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)">
      <div class="card"><div class="hd"><h2>Precisión en el cupo por familia</h2><div class="sp"></div><span class="legend"><span><i class="dash" style="background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 7px)"></i>elegida (${pct(E.precision)})</span><span><i style="background:var(--ink)"></i>azar</span></span></div><div class="bd">${U.dotRows({ w: 690, rows: pares, x0: 0.05, x1: 0.25, xt: [0.05, 0.1, 0.15, 0.2, 0.25], xf: v => dec(100 * v, 0) + ' %', rowH: 22, m: { l: 300, r: 118, t: 28, b: 30 }, vlines: [{ x: E.azar_mismo_cupo, label: `azar, mismo cupo: ${pct(E.azar_mismo_cupo)}` }, { x: E.precision, label: '', dash: '3 3', color: 'var(--accent)' }] })}</div></div>
      <div class="grid" style="gap:16px;align-content:start">
        <div class="note info">${I('info')}<div>Con el código de catálogo como único predictor, todo modelo estima la misma tabla de tasas por código. Ningún modelo se separa de la tasa fija: empatan, y la regla elige la más simple.</div></div>
        ${lateral}
      </div>
    </div>`;
    return;
  }
  document.getElementById('page').innerHTML = `${tabs}
  <div class="grid" style="align-items:start;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)">
    <div class="card">
      <div class="hd"><h2>Precisión en el cupo</h2><div class="sp"></div><span class="legend"><span><i></i>elegida</span><span><i class="ref"></i>empata con la mejor</span><span><i style="background:var(--text-grey)"></i>por debajo</span><span><i class="dash"></i>azar</span></span></div>
      <div class="bd">${U.dotRows({ w: 690, rows, x0: 0, x1: 0.3, xt: [0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3], xf: v => dec(100 * v, 0) + ' %', rowH: 22, m: { l: 300, r: 118, t: 28, b: 30 }, vlines: [{ x: E.azar_mismo_cupo, label: `azar, mismo cupo: ${pct(E.azar_mismo_cupo)}` }] })}</div>
      <div class="ft">Precisión en el cupo: CALIBRADA entre los elegidos llenando el cupo diario del 5 %. ${U.Qs()}. Los rombos son referencias que no pueden elegirse.</div>
    </div>
    ${lateral}
  </div>`;
};
</script>
</body>
</html>
