<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Hoja de códigos prioritarios · FordwardAI</title>
<link rel="stylesheet" href="ui.css">
</head>
<body data-role="desk" data-active="hoja" data-title="Hoja de códigos prioritarios" data-sub="Códigos ordenados por su tasa, con la cantidad sugerida para llenar el cupo diario">
<div id="act"></div>
<div id="page"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
window.render = U => {
  const { B, QS, I, num, dec, pct, rng, rngx, Q, lect, pend, esc } = U;
  const h = B.hoja, e = B.evaluacion, estado = QS.get('estado');
  const t5 = h.dia - B.meta.margen;
  const fila = c => h.filas.find(f => f.codigo === c);

  const paso = (ok, titulo, det, cls) => `<div class="${cls || (ok ? 'done' : '')}"><b>${ok === true ? I('check') : ok === false ? I('x') : I('clock')} ${titulo}</b><span class="xs ink2">${det}</span></div>`;
  const entradas = s => `<div class="steps">
    ${s.programa ? paso(true, 'Programa del día', `${num(h.programadas)} unidades · ${h.codigos} códigos`) : paso(false, 'Programa del día', 'sin cargar', 'pend')}
    ${s.programa ? paso(true, 'Cupo del día', `${h.cupo} unidades · Calidad de Planta`) : paso(null, 'Cupo del día', 'se confirma con el programa')}
    ${s.qls ? paso(true, 'Resultados de auditoría', `exportación QLS · conocidos hasta el Día ${t5}`) : paso(false, 'Resultados de auditoría', 'exportación QLS no disponible', 'err')}
    ${s.programa && s.qls ? paso(true, 'Hoja armada', `Día ${h.dia} · al inicio del día`) : paso(false, 'Hoja armada', 'no se arma sin sus entradas')}
  </div>`;

  if (estado === 'sin-programa') {
    document.getElementById('act').innerHTML = `<button class="btn" disabled>${I('download')}Exportar planilla</button><button class="btn" disabled>${I('printer')}Imprimir</button>`;
    document.getElementById('page').innerHTML = `${entradas({ programa: false, qls: true })}
    <div class="card"><div class="bd">
      <div class="empty">
        <div class="ic">${I('upload')}</div>
        <h3>Falta el programa de producción del Día ${h.dia}</h3>
        <p>La hoja prioriza los códigos que se van a producir hoy. Cargá el programa del día (qué unidades y de qué código) para armarla. Calidad de Planta confirma el cupo del día al cargarlo.</p>
        <div class="drop" style="max-width:640px;margin:0 auto 14px">${I('file')}<div style="margin:6px 0 10px"><b>Arrastrá el archivo CSV acá</b> o</div><button class="btn pri">${I('upload')}Elegir archivo</button><div class="xs muted" style="margin-top:10px">Columnas <b>unidad,codigo</b>, una fila por unidad. Sin identificadores de VIN: la unidad puede ser el número interno del programa.</div></div>
        <div style="max-width:640px;margin:0 auto;text-align:left">
          <div class="eyebrow" style="margin-bottom:6px">Formato esperado</div>
          <table class="t"><thead><tr><th>unidad</th><th>codigo</th></tr></thead><tbody>${h.programa_muestra.slice(0, 4).map(([u, c]) => `<tr><td>${u}</td><td class="cod">${c}</td></tr>`).join('')}<tr class="dim"><td colspan="2">…</td></tr></tbody></table>
          <div class="xs muted" style="margin-top:6px">Ejemplo con identificadores ficticios del programa simulado.</div>
        </div>
      </div>
    </div></div>
    <div class="note">${I('info')}<div>Hasta que llegue el programa, el equipo de analistas puede seguir como hoy: la plataforma no sugiere unidades sin saber qué se produce. Se puede <a href="d-config.html">cargar el programa desde Configuración</a> o importarlo acá.</div></div>`;
    return;
  }

  if (estado === 'qls-caido') {
    const porCod = {};
    h.sorteo_qls.forEach(x => { (porCod[x.codigo] = porCod[x.codigo] || []).push(x.unidad); });
    document.getElementById('act').innerHTML = `<button class="btn">${I('download')}Exportar lista al azar</button><button class="btn pri">${I('printer')}Imprimir lista al azar</button>`;
    document.getElementById('page').innerHTML = `${entradas({ programa: true, qls: false })}
    <div class="note bad">${I('off')}<div><b>No se pudo leer la exportación de resultados de Auditoría Adicional.</b> La plataforma no puede verificar la fuente (su huella) ni saber qué códigos vencieron el mínimo por código. Para no armar una hoja con datos sin verificar, hoy propone <b>seleccionar al azar, como se hace hoy</b>.</div></div>
    <div class="grid g-3-2">
      <div class="card">
        <div class="hd"><h2>Selección al azar del Día ${h.dia}</h2><span class="tag gray">${I('shuffle')}método actual</span><div class="sp"></div><span class="small muted">${h.cupo} de ${num(h.programadas)} unidades programadas</span></div>
        <div class="bd">
          <p class="small ink2" style="margin-top:0">Sorteo del cupo entre todas las unidades del programa, sin mirar el código. Queda registrado con su semilla (${h.semilla_sorteo}) para poder repetirlo.</p>
          <table class="t"><thead><tr><th>Código</th><th class="num">Unidades</th><th>Unidades sorteadas</th></tr></thead><tbody>
          ${Object.entries(porCod).map(([c, us]) => `<tr><td class="cod">${c}</td><td class="num">${us.length}</td><td>${us.map(u => `<span class="chip-u">${u}</span>`).join('')}</td></tr>`).join('')}
          </tbody></table>
        </div>
        <div class="ft">Este día se registra como «sin hoja»: no se usa para medir la hoja frente al azar.</div>
      </div>
      <div class="grid" style="gap:16px;align-content:start">
        <div class="card"><div class="hd"><h2>Qué pasó</h2></div><div class="bd small">
          <dl class="kv"><dt>Fuente</dt><dd>Exportación diaria de QLS con resultados de Auditoría Adicional</dd><dt>Estado</dt><dd><span class="tag bad">${I('x')}no disponible</span></dd><dt>Último control correcto</dt><dd>Día ${h.dia - 1}</dd><dt>Programa del día</dt><dd><span class="tag ok">${I('check')}cargado</span></dd></dl>
          <hr class="sep"><div class="small ink2">Cuando vuelva la exportación, la hoja se arma de nuevo y se puede usar en las rondas que falten del día.</div>
        </div></div>
        <div class="card"><div class="hd"><h2>A quién se avisa</h2></div><div class="bd small ink2">Calidad de Planta y el equipo de analistas ven este aviso al abrir la plataforma. El responsable técnico recibe la falla de lectura.</div></div>
      </div>
    </div>`;
    return;
  }

  // Estado normal: la hoja del día.
  const ultimo = h.filas.map(f => !!f.sugerida).lastIndexOf(true);
  const filas = h.filas.map((f, i) => {
    const tr = `<tr class="${f.sugerida ? 'hl' : 'dim'}" data-tip="${esc(`${f.codigo}: ${f.cal} CALIBRADA de ${f.n} auditados con resultado`)}"><td class="num muted">${i + 1}</td><td class="cod">${f.codigo}</td><td class="num"><b>${f.sugerida || ''}</b>${h.exploracion.some(x => x.codigo === f.codigo) ? ' <span class="tag info">+1 mínimo</span>' : ''}</td>
      <td class="num">${f.rango ? `${pct(f.tasa)} <span class="muted">(${rng(f.rango)})</span>` : `${pct(f.tasa)} <span class="muted">(sin resultados: tasa general)</span>`}</td>
      <td class="num">${num(f.n)}</td><td class="num">${dec(f.veces)}</td><td class="num">${f.programadas}</td><td class="num">${f.acumulado}</td>
      <td>${f.mercado}</td><td>${f.version}</td><td>${f.motor}</td><td>${f.traccion}</td></tr>`;
    return i === ultimo ? tr + `<tr class="cut"><td colspan="12">${I('up')} Hasta acá se llena el cupo del día (${h.cupo}, con ${h.exploracion.length} del mínimo por código). Más abajo: sin cifra evaluada.</td></tr>` : tr;
  }).join('');
  const pq = h.por_que[0];
  const ag = Object.entries(h.agrupaciones).sort((a, b) => b[1].chi2 - a[1].chi2);
  document.getElementById('act').innerHTML = `<button class="btn">${I('download')}Exportar planilla</button><button class="btn pri">${I('printer')}Imprimir</button>`;
  document.getElementById('page').innerHTML = `${entradas({ programa: true, qls: true })}
  <div class="note info">${I('info')}<div><b>Evaluación:</b> con el cupo del 5 %, ${Q()}: de cada 100 unidades elegidas se calibrarían ${dec(100 * e.precision, 1)} (rango del 95 %: ${rng(e.rango)}), contra ${dec(100 * e.azar_mismo_cupo, 1)} al azar. Resultado: <b>${e.lectura === 'mejora' ? 'mejor que el azar' : e.lectura}</b>. Prueba final: ${pend()}</div></div>

  <div class="card">
    <div class="hd"><h2>Día ${h.dia}</h2><span class="tag info">cupo ${h.cupo}</span><span class="small muted">${num(h.programadas)} unidades programadas · ${h.codigos} códigos</span><div class="sp"></div><span class="xs muted">Prioriza códigos: dentro de un código las unidades son equivalentes.</span></div>
    <div class="tbl-wrap"><table class="t">
      <thead><tr><th class="num">#</th><th>Código</th><th class="num">Cantidad<br>sugerida</th><th class="num">Tasa (rango 95 %)</th><th class="num">n</th><th class="num">Veces la<br>tasa general</th><th class="num">Unidades<br>programadas</th><th class="num">Acumulado</th><th>Mercado de<br>destino</th><th>Versión<br>(dominante)</th><th>Motor<br>(dominante)</th><th>Tracción</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
    <div class="ft">Tasa: proporción CALIBRADA del código entre sus auditados con resultado conocido (hasta el Día ${h.ventana[1]}), con la alternativa elegida en validación, ${e.ganadora}. Tasa general: ${pct(h.general)}, entre auditados con actividad QLS, hasta el Día ${h.ventana[1]}, base ficticia, n = ${num(h.n_ventana)} VIN. El cupo del 5 % es el único corte con cifra evaluada.</div>
  </div>

  <div class="grid g3">
    <div class="card">
      <div class="hd"><h2>Mínimo por código</h2><span class="tag gray">filas aparte</span></div>
      <div class="bd">
        <table class="t"><thead><tr><th>Código</th><th class="num">Cantidad</th><th>Último resultado conocido</th></tr></thead><tbody>
        ${h.exploracion.map(x => `<tr><td class="cod">${x.codigo}</td><td class="num"><b>1</b></td><td>${x.ultimo != null ? 'Día ' + x.ultimo : 'ninguno'}</td></tr>`).join('')}
        </tbody></table>
        <p class="small ink2" style="margin-bottom:0">Una unidad a cada código programado sin resultado conocido en los últimos ${h.P} días (P ${h.P_origen}), el más antiguo primero. Mantiene al día la tasa de los códigos poco elegidos.</p>
      </div>
    </div>
    <div class="card">
      <div class="hd"><h2>Por qué este código</h2></div>
      <div class="bd">
        <div><span class="cod" style="font-size:16px">${pq.codigo}</span> <span class="small">${pct(pq.tasa)} · ${dec(pq.veces)} veces la tasa general (${pq.cal} calibradas de ${pq.n})</span></div>
        <p class="small ink2">Su mercado de destino, <b>${pq.mercado}</b>, se calibró en <b>${pct(pq.tasa_mercado)}</b> (n = ${num(pq.n_mercado)}) contra ${pct(pq.general_mercado)} en general, días ${h.ventana_mercado[0]}–${h.ventana_mercado[1]}.</p>
        <div class="eyebrow" style="margin:4px 0 2px">Diferencia entre grupos (χ²), ${U.tramoV}</div>
        ${U.hbars({ w: 330, max: ag[0][1].chi2 * 1.05, m: { l: 140, r: 44 }, rowH: 22, rows: ag.map(([k, v], i) => ({ label: k, v: v.chi2, text: dec(v.chi2, 1), bold: i === 0, color: i === 0 ? 'var(--accent)' : 'var(--ref)', tip: `${k}: χ² ${dec(v.chi2, 1)} con ${v.grupos} grupos` })) })}
        <div class="xs muted">El mercado de destino es la agrupación del catálogo que más separa las tasas. Es una asociación, no una causa.</div>
      </div>
    </div>
    <div class="card">
      <div class="hd"><h2>Unidades sugeridas</h2><span class="tag info">${h.unidades.reduce((s, u) => s + u.ids.length, 0)}</span></div>
      <div class="bd">
        ${h.unidades.map(u => `<div style="margin-bottom:10px"><div class="small"><span class="cod">${u.codigo}</span> <span class="muted">· ${u.motivo.toLowerCase()} · ${u.ids.length}</span></div><div>${u.ids.map(x => `<span class="chip-u">${x}</span>`).join('')}</div></div>`).join('')}
        <div class="xs muted">Identificadores del programa (ficticios en el prototipo), nunca VIN. Cualquier unidad del mismo código sirve.</div>
      </div>
    </div>
  </div>
  <div class="grid g2">
    <div class="note">${I('target')}<div><b>Dónde mirar</b> (componente a revisar primero): se activa en la hoja solo si se sostiene en la prueba final. ${pend()}</div></div>
    <div class="note">${I('dn')}<div><b>Códigos que casi no se calibran:</b> entran en la hoja solo si se sostienen en la prueba final. ${pend()}</div></div>
  </div>`;
};
</script>
</body>
</html>
