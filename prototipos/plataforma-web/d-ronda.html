<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Ronda en la playa · FordwardAI</title>
<link rel="stylesheet" href="ui.css">
</head>
<body data-role="desk" data-active="ronda" data-title="Ronda en la playa de despacho" data-sub="El equipo de analistas marca qué códigos llegaron y qué unidades tomó; lo pendiente baja por el ranking">
<div id="act"></div>
<div id="page"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
window.render = U => {
  const { B, QS, I, num, dec, pct, esc } = U;
  const h = B.hoja, r = B.ronda, estado = QS.get('estado');
  const pos = c => h.filas.findIndex(f => f.codigo === c) + 1;
  const fila = c => h.filas.find(f => f.codigo === c);
  const ids = c => h.unidades.filter(u => u.codigo === c).flatMap(u => u.ids);
  const esMin = c => h.exploracion.some(x => x.codigo === c);
  const rondas = n => `<div class="steps">${['Ronda 1', 'Ronda 2', 'Ronda 3', 'Ronda 4', 'Última ronda'].map((t, i) =>
    `<div class="${i < n ? 'done' : i === n ? 'on' : ''}"><b>${i < n ? I('check') : i === n ? I('pin') : I('clock')} ${t}</b><span class="xs ink2">${i < n ? 'registrada' : i === n ? 'en curso' : 'cada 2 h aprox.'}</span></div>`).join('')}</div>`;

  if (estado === 'no-llego') {
    const cods = [...new Set([...Object.keys(r.sugeridas), ...Object.keys(r.nueva)])].sort((a, b) => pos(a) - pos(b));
    const pendientes = Object.entries(r.sugeridas).reduce((s, [c, q]) => s + Math.max(0, q - (r.nueva[c] || 0)), 0);
    const recibe = cods.filter(c => (r.nueva[c] || 0) > (r.sugeridas[c] || 0));
    const llego = c => c === r.primero ? r.llego_primero : c === r.ausente ? 0 : fila(c).programadas;
    document.getElementById('act').innerHTML = `<button class="btn">${I('download')}Exportar registro</button><button class="btn pri">${I('check')}Cerrar el día</button>`;
    document.getElementById('page').innerHTML = `${rondas(4)}
    <div class="note warn">${I('alert')}<div><b>${r.primero}</b> llegó a la playa con ${r.llego_primero} de sus ${fila(r.primero).programadas} unidades programadas y <b>${r.ausente}</b> (mínimo por código) no llegó. Quedan <b>${pendientes}</b> unidades del cupo sin tomar: pasan a los códigos siguientes del ranking que sí llegaron.</div></div>
    <div class="grid g-3-2">
      <div class="card">
        <div class="hd"><h2>Reasignación de lo pendiente</h2><span class="tag info">cupo ${h.cupo}</span><div class="sp"></div><span class="small muted">al azar: <b>${r.azar}</b></span></div>
        <table class="t">
          <thead><tr><th class="num">Ranking</th><th>Código</th><th>Motivo</th><th class="num">Sugerida al inicio</th><th class="num">Llegaron a la playa</th><th class="num">Nueva cantidad</th><th>Cambio</th></tr></thead>
          <tbody>${cods.map(c => {
            const a = r.sugeridas[c] || 0, n = r.nueva[c] || 0, d = n - a;
            return `<tr class="${d > 0 ? 'hl' : ''}"><td class="num muted">${pos(c)}</td><td class="cod">${c}</td><td>${esMin(c) ? '<span class="tag gray">Mínimo por código</span>' : a ? '<span class="tag info">Prioridad</span>' : '<span class="tag info">Siguiente del ranking</span>'}</td>
              <td class="num">${a || '—'}</td><td class="num">${llego(c)} <span class="muted">de ${fila(c).programadas}</span></td><td class="num"><b>${n}</b></td>
              <td>${d > 0 ? `<span class="tag ok">${I('down')}+${d} recibe</span>` : d < 0 ? `<span class="tag warn">${I('right')}${d} pasa abajo</span>` : '<span class="muted">sin cambio</span>'}</td></tr>`;
          }).join('')}</tbody>
        </table>
        <div class="ft">Calculado con la regla de reasignación de la solución, sobre el ranking del Día ${h.dia}: lo pendiente de cada código pasa a los siguientes del ranking que tengan unidades en la playa. Solo se completa al azar si se agota el ranking.</div>
      </div>
      <div class="grid" style="gap:16px;align-content:start">
        <div class="card"><div class="hd"><h2>Cómo bajó lo pendiente</h2></div><div class="bd">
          <ul class="list">${recibe.map(c => `<li>${I('down')}<div><span class="cod">${c}</span> recibe <b>${(r.nueva[c] || 0) - (r.sugeridas[c] || 0)}</b> <span class="muted small">(puesto ${pos(c)}, ${pct(fila(c).tasa)}, ${fila(c).mercado})</span></div></li>`).join('')}</ul>
          <div class="small ink2">Unidades del cupo cubiertas: <b>${Object.values(r.nueva).reduce((s, x) => s + x, 0)} de ${h.cupo}</b>. Al azar: ${r.azar}.</div>
        </div></div>
        <div class="card"><div class="hd"><h2>Si se agota el ranking</h2><span class="tag gray">caso extremo</span></div><div class="bd small">
          <p style="margin-top:0" class="ink2">Ejemplo con la misma hoja: si en todo el día solo llegaran ${Object.values(r.pocos).reduce((s, x) => s + x, 0)} unidades de los códigos del ranking (${Object.entries(r.pocos).map(([c, q]) => `${q} de ${c}`).join(', ')}), se tomarían esas y el resto del cupo se completaría al azar.</p>
          <div style="display:flex;gap:16px"><div><div class="eyebrow">Por el ranking</div><div class="big">${Object.values(r.nueva_pocos).reduce((s, x) => s + x, 0)}</div></div><div><div class="eyebrow">Al azar</div><div class="big" style="color:var(--text-grey)">${r.azar_pocos}</div></div></div>
        </div></div>
      </div>
    </div>`;
    return;
  }

  // Estado normal: ronda 2 en curso (estado de ejemplo del prototipo).
  const tomadas = { [r.primero]: 4 };
  h.exploracion.slice(0, 1).forEach(x => { tomadas[x.codigo] = 1; });
  const cods = [...Object.keys(r.sugeridas)].sort((a, b) => (esMin(a) - esMin(b)) || pos(a) - pos(b));
  const tot = Object.values(tomadas).reduce((s, x) => s + x, 0);
  document.getElementById('act').innerHTML = `<button class="btn">${I('alert')}Un código no llegó</button><button class="btn pri">${I('check')}Registrar ronda</button>`;
  document.getElementById('page').innerHTML = `${rondas(1)}
  <div class="grid" style="align-items:start;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)">
    <div class="card">
      <div class="hd"><h2>Pendiente por código</h2><span class="tag info">${tot} de ${h.cupo} tomadas</span><div class="sp"></div><div class="bar" style="width:180px"><i style="width:${100 * tot / h.cupo}%"></i></div></div>
      <table class="t">
        <thead><tr><th>Código</th><th>Motivo</th><th class="num">Sugerida</th><th class="num">Tomadas</th><th class="num">Pendiente</th><th>¿En la playa?</th><th>Unidades del programa</th></tr></thead>
        <tbody>${cods.map(c => {
          const q = r.sugeridas[c], t = tomadas[c] || 0, us = ids(c);
          return `<tr class="${q - t ? 'hl' : ''}"><td class="cod">${c}</td><td>${esMin(c) ? '<span class="tag gray">Mínimo por código</span>' : '<span class="tag info">Prioridad</span>'}</td><td class="num">${q}</td><td class="num">${t}</td><td class="num"><b>${q - t}</b></td>
            <td><div class="seg"><a class="${t ? 'on' : ''}">Sí</a><a>No</a><a class="${t ? '' : 'on'}">Sin ver</a></div></td>
            <td class="wrap">${us.map((u, i) => `<span class="chip-u ${i < t ? 'done' : ''}">${i < t ? '✓ ' : ''}${u}</span>`).join('')}</td></tr>`;
        }).join('')}</tbody>
      </table>
      <div class="ft">Dentro de un código cualquier unidad sirve: la lista es una sugerencia del programa, no una elección de VIN concretos.</div>
    </div>
    <div class="grid" style="gap:16px;align-content:start">
      <div class="card"><div class="hd"><h2>Registrar unidad tomada</h2></div><div class="bd">
        <div class="field"><label>Código en la etiqueta del parabrisas</label><div class="in"><span class="cod">${r.primero}</span><span class="sp" style="flex:1"></span><span class="tag ok">${I('check')}en la hoja · pendiente ${r.sugeridas[r.primero] - tomadas[r.primero]}</span></div></div>
        <div class="field" style="margin-top:10px"><label>Unidad (opcional)</label><div class="in">${ids(r.primero)[tomadas[r.primero]]}</div><div class="help">Si el programa trae identificador de unidad; si no, basta con el código.</div></div>
        <div style="margin-top:12px;display:flex;gap:8px"><button class="btn pri">${I('plus')}Agregar</button><button class="btn ghost">Código fuera de la hoja</button></div>
      </div></div>
      <div class="card"><div class="hd"><h2>Reglas de la ronda</h2></div><div class="bd small ink2">
        <ul class="list">
          <li>${I('hoja')}<div>Tomar unidades de los códigos con cantidad pendiente, de arriba hacia abajo.</div></li>
          <li>${I('down')}<div>Si un código no llega (o llega con menos unidades), lo pendiente pasa a los códigos siguientes del ranking que sí llegaron.</div></li>
          <li>${I('shuffle')}<div>Solo si se agota el ranking, completar al azar.</div></li>
        </ul>
      </div></div>
    </div>
  </div>`;
};
</script>
</body>
</html>
