<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="il-plataforma-titulo il-plataforma-desc">
  <title id="il-plataforma-titulo">Plataforma web propuesta (esquema)</title>
  <desc id="il-plataforma-desc">Esquema ilustrativo, sin datos, de la plataforma web propuesta en una notebook: navegación lateral, indicadores, un gráfico y una tabla de códigos. Las capturas reales se cargan localmente porque muestran tasas por código.</desc>
  <!-- Ilustración a mano: bloques esquemáticos, SIN números ni tasas.
       Colores por variables CSS «figura-…»; los valores de respaldo son el tema oscuro Twilight. -->
  <style>
    .il-fondo { fill: var(--figura-fondo, #00142E); }
    .il-t { fill: var(--figura-texto, #FFFFFF); font-family: var(--figura-fuente, "Ford F-1", Roboto, Arial, sans-serif); }
    .il-tenue { fill: var(--figura-tenue, rgba(255, 255, 255, .72)); }
    .il-equipo { fill: var(--figura-equipo, #0B1F3A); stroke: var(--figura-borde, rgba(255, 255, 255, .24)); stroke-width: 2; }
    .il-base { fill: var(--figura-equipo-base, #13294A); stroke: var(--figura-borde, rgba(255, 255, 255, .24)); stroke-width: 2; }
    .il-pantalla { fill: var(--figura-pantalla, #F0F2F7); }
    .il-barra { fill: var(--figura-pantalla-tinta, #00095B); }
    .il-bloque { fill: var(--figura-pantalla-bloque, rgba(0, 9, 91, .10)); }
    .il-bloque-2 { fill: var(--figura-pantalla-bloque-2, rgba(0, 9, 91, .22)); }
    .il-tarjeta { fill: var(--figura-pantalla-tarjeta, #FFFFFF); stroke: var(--figura-pantalla-borde, rgba(0, 9, 91, .12)); stroke-width: 1; }
    .il-acento { fill: var(--figura-acento, #066FEF); }
    .il-acento-suave { fill: var(--figura-acento-suave, rgba(6, 111, 239, .28)); }
    .il-claro { fill: rgba(255, 255, 255, .85); }
  </style>

  <rect class="il-fondo" width="1200" height="675"/>

