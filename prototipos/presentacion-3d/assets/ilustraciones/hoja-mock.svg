    <rect class="il-bloque" x="232" y="384" width="532" height="1"/>
    <rect class="il-barra" x="256" y="399" width="64" height="8" rx="4"/>
    <rect class="il-bloque-2" x="340" y="399" width="22" height="8" rx="4"/>
    <rect class="il-bloque-2" x="406" y="399" width="70" height="8" rx="4"/>
    <rect class="il-bloque-2" x="494" y="399" width="22" height="8" rx="4"/>
    <rect class="il-bloque-2" x="530" y="399" width="40" height="8" rx="4"/>
    <rect class="il-bloque-2" x="614" y="399" width="40" height="8" rx="4"/>
    <rect class="il-bloque-2" x="692" y="399" width="58" height="8" rx="4"/>
    <rect class="il-bloque" x="232" y="424" width="532" height="1"/>
    <rect class="il-barra" x="256" y="439" width="52" height="8" rx="4"/>
    <rect class="il-bloque-2" x="340" y="439" width="22" height="8" rx="4"/>
    <rect class="il-bloque-2" x="406" y="439" width="70" height="8" rx="4"/>
    <rect class="il-bloque-2" x="494" y="439" width="22" height="8" rx="4"/>
    <rect class="il-bloque-2" x="530" y="439" width="40" height="8" rx="4"/>
    <rect class="il-bloque-2" x="614" y="439" width="40" height="8" rx="4"/>
    <rect class="il-bloque-2" x="692" y="439" width="62" height="8" rx="4"/>
  </g>

  <!-- Panel lateral -->
  <g class="fila" style="--i:4">
    <rect class="il-tarjeta" x="794" y="176" width="188" height="170" rx="10"/>
    <text class="il-tinta" x="810" y="204" font-size="14" font-weight="600">Por qué este código</text>
    <rect class="il-bloque-2" x="810" y="222" width="150" height="8" rx="4"/>
