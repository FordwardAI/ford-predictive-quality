<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="il-hoja-titulo il-hoja-desc">
  <title id="il-hoja-titulo">Hoja de códigos prioritarios (esquema)</title>
  <desc id="il-hoja-desc">Esquema ilustrativo, sin datos, de la hoja de códigos prioritarios en una notebook: una fila por código con cantidad sugerida, tasa con rango, n, veces la tasa general, acumulado y mercado de destino, y el panel «Por qué este código». La captura real se carga localmente porque muestra tasas por código.</desc>
  <!-- Ilustración a mano: bloques esquemáticos, SIN números ni tasas. Columnas según
       prototipos/plataforma-web/d-hoja.html. Colores por variables CSS «figura-…». -->
  <style>
    .il-fondo { fill: var(--figura-fondo, #00142E); }
    .il-t { fill: var(--figura-texto, #FFFFFF); font-family: var(--figura-fuente, "Ford F-1", Roboto, Arial, sans-serif); }
    .il-tenue { fill: var(--figura-tenue, rgba(255, 255, 255, .72)); }
    .il-equipo { fill: var(--figura-equipo, #0B1F3A); stroke: var(--figura-borde, rgba(255, 255, 255, .24)); stroke-width: 2; }
    .il-base { fill: var(--figura-equipo-base, #13294A); stroke: var(--figura-borde, rgba(255, 255, 255, .24)); stroke-width: 2; }
    .il-pantalla { fill: var(--figura-pantalla, #F0F2F7); }
    .il-tinta { fill: var(--figura-pantalla-tinta, #00095B); font-family: var(--figura-fuente, "Ford F-1", Roboto, Arial, sans-serif); }
    .il-tinta-2 { fill: var(--figura-pantalla-tinta-2, rgba(0, 9, 91, .64)); font-family: var(--figura-fuente, "Ford F-1", Roboto, Arial, sans-serif); }
    .il-barra { fill: var(--figura-pantalla-tinta, #00095B); }
    .il-bloque { fill: var(--figura-pantalla-bloque, rgba(0, 9, 91, .08)); }
    .il-bloque-2 { fill: var(--figura-pantalla-bloque-2, rgba(0, 9, 91, .22)); }
    .il-tarjeta { fill: var(--figura-pantalla-tarjeta, #FFFFFF); stroke: var(--figura-pantalla-borde, rgba(0, 9, 91, .12)); stroke-width: 1; }
    .il-acento { fill: var(--figura-acento, #066FEF); }
    .il-acento-suave { fill: var(--figura-acento-suave, rgba(6, 111, 239, .16)); }
    .il-claro { fill: rgba(255, 255, 255, .85); }
  </style>

  <rect class="il-fondo" width="1200" height="675"/>

  <!-- Notebook -->
  <rect class="il-equipo" x="170" y="40" width="860" height="530" rx="22"/>
  <rect class="il-pantalla" x="194" y="64" width="812" height="482" rx="6"/>
  <path class="il-base" d="M90 574h1020l-34 30H124z"/>
  <rect class="il-equipo" x="540" y="574" width="120" height="8" rx="4"/>

  <!-- Encabezado de la hoja -->
  <rect class="il-barra" x="194" y="64" width="812" height="40"/>
  <rect class="il-claro" x="212" y="78" width="120" height="12" rx="6"/>
  <text class="il-tinta" x="218" y="140" font-size="20" font-weight="600">Hoja de códigos prioritarios</text>
  <rect class="il-bloque-2" x="218" y="152" width="200" height="9" rx="4.5"/>
  <rect class="il-acento" x="866" y="124" width="116" height="26" rx="13"/>
  <rect class="il-claro" x="884" y="134" width="80" height="6" rx="3"/>

  <!-- Tabla: una fila por código -->
  <g class="fila" style="--i:0">
