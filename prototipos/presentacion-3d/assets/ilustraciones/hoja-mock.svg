    <rect class="il-barra" x="256" y="279" width="56" height="8" rx="4"/>
    <rect class="il-bloque-2" x="340" y="279" width="22" height="8" rx="4"/>
    <rect class="il-bloque-2" x="406" y="279" width="70" height="8" rx="4"/>
    <rect class="il-bloque-2" x="494" y="279" width="22" height="8" rx="4"/>
    <rect class="il-bloque-2" x="530" y="279" width="40" height="8" rx="4"/>
    <rect class="il-bloque-2" x="614" y="279" width="40" height="8" rx="4"/>
    <rect class="il-bloque-2" x="692" y="279" width="52" height="8" rx="4"/>
