    <rect class="il-bloque" x="218" y="176" width="560" height="44" rx="10"/>
    <g class="il-tinta-2" font-size="11" font-weight="600">
      <text x="232" y="202">#</text>
      <text x="256" y="202">Código</text>
      <text x="340" y="202">Cantidad</text>
      <text x="406" y="196">Tasa</text>
      <text x="406" y="210">(rango 95 %)</text>
      <text x="494" y="202">n</text>
      <text x="530" y="196">Veces la</text>
      <text x="530" y="210">tasa general</text>
      <text x="614" y="202">Acumulado</text>
      <text x="692" y="196">Mercado</text>
      <text x="692" y="210">de destino</text>
    </g>
  </g>
