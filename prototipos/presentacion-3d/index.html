<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FordwardAI · Trials Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <a class="saltar" href="#capitulos">Saltar al contenido</a>

  <canvas id="escena" aria-hidden="true"></canvas>
  <div id="fondo-estatico" aria-hidden="true"></div>
  <div id="velo" aria-hidden="true"></div>
  <div id="etiquetas"></div>

  <header class="cabecera">
    <p class="cabecera-marca">FordwardAI <span class="marca-sep" aria-hidden="true">·</span> <span class="marca-desafio">Ford Innovation Challenge III</span></p>
    <nav class="cabecera-acciones" aria-label="Controles de la presentación">
      <button type="button" class="boton" id="boton-indice" aria-haspopup="dialog" aria-controls="indice">
        <span>Índice</span><kbd aria-hidden="true">I</kbd>
      </button>
      <button type="button" class="boton" id="boton-notas" title="Abre las notas del orador en otra ventana">
        <span>Notas</span><kbd aria-hidden="true">N</kbd>
      </button>
      <button type="button" class="boton boton-icono" id="boton-pantalla" aria-label="Pantalla completa" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </nav>
  </header>

  <main id="capitulos" tabindex="-1" aria-busy="true">
    <p class="cargando">Cargando presentación…</p>
  </main>

  <footer class="pie">
    <span class="pie-numero" id="pie-numero" aria-hidden="true"></span>
    <span class="pie-seccion" id="pie-seccion" aria-live="polite" aria-atomic="true"></span>
  </footer>
  <nav class="progreso" aria-label="Pantallas">
    <ol class="progreso-marcas" id="progreso-marcas"></ol>
  </nav>

  <p class="ayuda-orbita" id="ayuda-orbita" hidden>
    <kbd>O</kbd> <span id="ayuda-orbita-texto">explorar el vehículo</span>
  </p>

  <dialog class="indice" id="indice" aria-labelledby="indice-titulo">
    <div class="indice-cabecera">
      <p class="antetitulo" id="indice-titulo">Índice</p>
      <p class="indice-pendientes" id="indice-pendientes" hidden></p>
      <button type="button" class="boton" id="cerrar-indice"><span>Cerrar</span><kbd aria-hidden="true">Esc</kbd></button>
    </div>
    <nav aria-label="Pantallas de la presentación">
      <ol class="indice-lista" id="indice-lista"></ol>
    </nav>
    <p class="indice-atajos">
      <kbd>→</kbd> pantalla siguiente, completa · <kbd>←</kbd> anterior · <kbd>0</kbd>–<kbd>6</kbd> sección · <kbd>N</kbd> notas · <kbd>F</kbd> pantalla completa · <kbd>O</kbd> órbita · <kbd>L</kbd> calidad
    </p>
  </dialog>

  <p class="aviso" id="aviso" role="status" hidden></p>

  <noscript>
    <div class="sin-js">
      <p class="antetitulo">FordwardAI · Ford Innovation Challenge III</p>
      <p class="sin-js-titulo">Esta presentación necesita <span class="acento">JavaScript</span>.</p>
      <p>Habilitalo o abrí el informe de la entrega en <code>docs/entrega/</code>.</p>
    </div>
  </noscript>
</body>
</html>
